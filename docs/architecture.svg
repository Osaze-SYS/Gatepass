<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
  <rect width="860" height="470" fill="#fff"/>
  <text x="430" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#000">Gatepass architecture</text>
  <g fill="#fff" stroke="#000" stroke-width="2">
    <rect x="30" y="70" width="190" height="80"/><rect x="30" y="300" width="190" height="80"/>
    <rect x="330" y="150" width="210" height="170"/>
    <rect x="640" y="60" width="190" height="70"/><rect x="640" y="170" width="190" height="70"/><rect x="640" y="290" width="190" height="100"/>
  </g>
  <g fill="#000" text-anchor="middle">
    <text x="125" y="105" font-weight="bold">Buyer browser</text><text x="125" y="127" font-size="12">events, checkout, ticket page</text>
    <text x="125" y="335" font-weight="bold">Organizer browser</text><text x="125" y="357" font-size="12">dashboard, gate scanner</text>
    <text x="435" y="180" font-weight="bold">Express API (server.js)</text>
    <text x="435" y="208" font-size="12">orders.js: reserve, expire, fulfil</text>
    <text x="435" y="228" font-size="12">tickets.js: signed QR codes</text>
    <text x="435" y="248" font-size="12">auth.js: scrypt, signed tokens</text>
    <text x="435" y="268" font-size="12">payments.js: Paystack or mock</text>
    <text x="435" y="288" font-size="12">mailer.js: ticket and refund emails</text><text x="435" y="308" font-size="12">fees, images, rate limiting</text>
    <text x="735" y="92" font-weight="bold">Paystack</text><text x="735" y="112" font-size="12">payment page, webhook</text>
    <text x="735" y="202" font-weight="bold">Email (Brevo or SMTP)</text><text x="735" y="222" font-size="12">tickets, sales, refunds</text>
    <text x="735" y="322" font-weight="bold">PostgreSQL database</text><text x="735" y="342" font-size="12">users, events, pictures,</text><text x="735" y="360" font-size="12">ticket types, orders,</text><text x="735" y="378" font-size="12">tickets, refunds</text>
  </g>
  <g stroke="#000" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M220,100 L330,185"/><path d="M220,340 L330,285"/>
    <path d="M540,185 L640,100"/><path d="M640,120 L560,170" stroke-dasharray="6 4"/>
    <path d="M540,235 L640,205"/><path d="M540,285 L640,325"/>
  </g>
  <g fill="#000" font-size="12">
    <text x="232" y="130" transform="rotate(35 232 130)">HTTPS + JSON</text>
    <text x="232" y="328" transform="rotate(-27 232 328)">login token</text>
    <text x="548" y="150" transform="rotate(-35 548 150)">start payment</text>
    <text x="548" y="182" transform="rotate(-24 548 182)">signed webhook</text>
    <text x="570" y="228">send tickets</text><text x="560" y="318" transform="rotate(20 560 318)">atomic stock + refunds</text>
  </g>
  <text x="430" y="440" text-anchor="middle" font-size="12" fill="#000">The webhook is the source of truth for payment. Tickets are issued only after its signature and amount are verified.</text>
</svg>
