<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
  <rect width="960" height="740" fill="#fff"/>
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#000">Database schema (PostgreSQL)</text>
  <g fill="#fff" stroke="#000" stroke-width="2">
    <rect x="30" y="60" width="200" height="120"/><rect x="290" y="60" width="230" height="200"/><rect x="610" y="60" width="300" height="150"/>
    <rect x="290" y="320" width="230" height="130"/><rect x="610" y="290" width="300" height="270"/>
    <rect x="290" y="510" width="230" height="130"/><rect x="610" y="610" width="300" height="110"/>
  </g>
  <g stroke="#000" stroke-width="2"><path d="M30,88 H230"/><path d="M290,88 H520"/><path d="M610,88 H910"/><path d="M290,348 H520"/><path d="M610,318 H910"/><path d="M290,538 H520"/><path d="M610,638 H910"/></g>
  <g fill="#000">
    <text x="130" y="80" text-anchor="middle" font-weight="bold" font-size="15">users</text>
    <text x="42" y="112">id (PK)</text><text x="42" y="132">name</text><text x="42" y="152">email (unique)</text><text x="42" y="172">password_hash</text>
    <text x="405" y="80" text-anchor="middle" font-weight="bold" font-size="15">events</text>
    <text x="302" y="112">id (PK)</text><text x="302" y="132">organizer_id (FK users)</text><text x="302" y="152">title, description, venue</text><text x="302" y="172">category</text><text x="302" y="192">starts_at</text><text x="302" y="212">refund_cutoff_hours</text>
    <text x="760" y="80" text-anchor="middle" font-weight="bold" font-size="15">ticket_types</text>
    <text x="622" y="112">id (PK)</text><text x="622" y="132">event_id (FK events)</text><text x="622" y="152">name, price_kobo</text><text x="622" y="172">capacity (&gt; 0)</text><text x="622" y="192">sold  CHECK (sold &lt;= capacity)</text>
    <text x="405" y="340" text-anchor="middle" font-weight="bold" font-size="15">event_images</text>
    <text x="302" y="372">id (PK)</text><text x="302" y="392">event_id (FK events)</text><text x="302" y="412">mime, data (BYTEA)</text><text x="302" y="432">position (0 = cover)</text>
    <text x="760" y="310" text-anchor="middle" font-weight="bold" font-size="15">orders</text>
    <text x="622" y="342">id (PK), reference (unique)</text><text x="622" y="362">ticket_type_id (FK)</text><text x="622" y="382">quantity (1 to 10)</text>
    <text x="622" y="402">subtotal_kobo, fee_kobo</text><text x="622" y="422">amount_kobo, payout_kobo</text><text x="622" y="442">buyer_name, buyer_email</text>
    <text x="622" y="462">status: pending, paid, expired,</text><text x="622" y="480">refund_due, refund_pending, refunded</text><text x="622" y="500">expires_at, paid_at, refunded_at</text>
    <text x="405" y="530" text-anchor="middle" font-weight="bold" font-size="15">tickets</text>
    <text x="302" y="562">id (PK, random)</text><text x="302" y="582">order_id (FK orders)</text><text x="302" y="602">ticket_type_id (FK)</text><text x="302" y="622">checked_in_at, voided_at</text>
    <text x="760" y="630" text-anchor="middle" font-weight="bold" font-size="15">refunds</text>
    <text x="622" y="662">id (PK), order_id (FK orders)</text><text x="622" y="682">amount_kobo, reason</text><text x="622" y="702">initiated_by: buyer or organizer</text>
  </g>
  <g stroke="#000" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M230,125 H290"/><path d="M520,125 H610"/><path d="M405,260 V320"/><path d="M760,210 V290"/><path d="M610,520 H520"/><path d="M760,560 V610"/>
  </g>
  <g fill="#000" font-size="12"><text x="234" y="118">1 : many</text><text x="528" y="118">1 : many</text><text x="413" y="295">1 : many</text><text x="768" y="255">1 : many</text><text x="528" y="513">1 : many</text><text x="768" y="590">1 : many</text></g>
  <text x="30" y="700" font-size="12" fill="#000">Money is stored in kobo (integers).</text>
  <text x="30" y="718" font-size="12" fill="#000">Ticket codes are the id plus an HMAC signature, so they cannot be forged.</text>
</svg>
