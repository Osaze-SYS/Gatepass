# Optional: a local PostgreSQL server.   docker compose up -d
# Then set in .env:  DATABASE_URL=postgres://gatepass:gatepass@localhost:5432/gatepass
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gatepass
      POSTGRES_PASSWORD: gatepass
      POSTGRES_DB: gatepass
    ports: ["5432:5432"]
    volumes: ["gatepass-data:/var/lib/postgresql/data"]
volumes:
  gatepass-data:
