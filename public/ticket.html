<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your tickets · Gatepass</title><link rel="stylesheet" href="/css/style.css"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest"><meta name="theme-color" content="#1d4ed8"></head><body>
<header id="top"></header>
<main><div class="container rise-kids" style="padding-top:1.6rem;max-width:56rem" id="page" aria-live="polite"><p class="muted"><span class="spinner"></span> Checking your order…</p></div></main>
<script src="/js/common.js"></script>
<script>
const q = new URLSearchParams(location.search);
const ref = q.get('reference') || q.get('trxref');
const page = document.querySelector('#page');
let tries = 0, pendingShown = false;   // pendingShown stops the waiting card re-animating every 3 seconds

const message = (title, text, extra = '') => { page.innerHTML = `<div class="card center stack" style="padding:2.2rem"><h1 style="font-size:2rem">${title}</h1><p class="muted" style="max-width:32rem;margin-inline:auto">${text}</p>${extra}</div>`; };

async function load() {
  let o;
  try { o = await api('/api/orders/' + encodeURIComponent(ref)); }
  catch (e) { message('We couldn\'t find this order', esc(e.message), '<p><a class="btn" href="/">Browse events</a></p>'); return; }
  document.title = o.status === 'paid' ? 'Your tickets · ' + o.title : 'Order · Gatepass';

  if (o.status === 'pending') {
    if (!pendingShown) { pendingShown = true; message('<span class="spinner"></span> Waiting for your payment', 'This page updates by itself as soon as the payment is confirmed. You can keep it open.'); }
    if (++tries < 100) setTimeout(load, 3000);
    return;
  }
  if (o.status === 'expired') return message('This order expired', 'The payment was not completed in time, so the tickets were released.', '<p><a class="btn" href="/event.html?id=' + o.event_id + '">Try again</a></p>');
  if (o.status === 'refund_due') return message('Payment received, but the event sold out', `Your payment arrived after the hold ended and the last tickets were gone. The organizer will refund you. Keep this reference: <b>${esc(o.reference)}</b>.`);
  if (o.status === 'refund_pending') return message('Your refund is being processed', 'The tickets for this order no longer work. The money is on its way back to you.');
  if (o.status === 'refunded') return message('This order was refunded', `We returned ${nairaZero(o.amount_kobo)}. Banks can take a few days to show it.`, '<p><a class="btn" href="/">Browse events</a></p>');

  const r = o.refund;
  let refundBlock;
  if (r.available) {
    refundBlock = `<details class="card flat no-print"><summary>Need to cancel? Get an instant refund</summary>
        <p class="muted small" style="margin-top:.8rem">Free until ${esc(fmtDate(r.closesAt))}. Your tickets stop working once the refund is made.</p>
        <div class="field"><label for="remail">Email used at checkout</label><input id="remail" type="email" autocomplete="email"></div>
        <div id="rmsg" role="alert"></div><button class="btn danger outline" id="refund">Refund this order</button></details>`;
  } else if (r.request) {
    refundBlock = r.request.status === 'pending'
      ? `<div class="notice info no-print"><b>Refund request sent.</b> The organizer will review it and you will get an email with their decision. Your tickets stay valid until then.</div>`
      : `<div class="notice warn no-print"><b>The organizer could not approve your refund request.</b>${r.request.decline_note ? ' Their note: ' + esc(r.request.decline_note) : ''} Your tickets are still valid.</div>`;
  } else if (r.canRequest) {
    refundBlock = `<details class="card flat no-print"><summary>Can't make it? Ask the organizer for a refund</summary>
        <p class="muted small" style="margin-top:.8rem">Instant refunds closed ${r.cutoffHours} hours before the event. You can still send the organizer a request and they will decide. Your tickets keep working until a refund is approved.</p>
        <div class="field"><label for="qemail">Email used at checkout</label><input id="qemail" type="email" autocomplete="email"></div>
        <div class="field"><label for="qreason">Why do you need a refund? (optional)</label><textarea id="qreason" maxlength="300" rows="3"></textarea></div>
        <div id="qmsg" role="alert"></div><button class="btn" id="send-request">Send refund request</button></details>`;
  } else {
    refundBlock = `<p class="muted small no-print">${r.reason === 'none' ? 'This event has a no-refund policy. All sales are final.' : r.reason === 'used' ? 'Tickets that were already used at the gate cannot be refunded.' : 'This event has already started, so refunds are closed. Contact the organizer if you need help.'}</p>`;
  }

  const shareUrl = `${location.origin}/event.html?id=${o.event_id}`;
  const shareText = `I'm going to ${o.title}! Get your ticket here:`;
  const shareBlock = `<div class="card flat no-print" style="margin:0 0 1.4rem"><h3>Invite your friends</h3><p class="muted small">Share this link so they can get their tickets too.</p>
      <div class="row" style="flex-wrap:nowrap"><input id="share-link" readonly value="${esc(shareUrl)}" aria-label="Event link"><button class="btn" id="copy-link" style="flex:none">Copy link</button></div>
      <div class="row" style="margin-top:.7rem"><a class="btn secondary sm" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(shareText + ' ' + shareUrl)}">Share on WhatsApp</a>${navigator.share ? '<button class="btn secondary sm" id="native-share">More ways to share</button>' : ''}</div></div>`;

  page.innerHTML = `
    <div class="card banner" style="margin-bottom:1.4rem"><div class="thumb">${cover(o.cover_image_id, '', o.title)}</div>
      <div class="grow"><span class="badge ok">${ICON.tick.replace('<svg', '<svg style="width:.9rem;height:.9rem;vertical-align:-.15rem"')} Confirmed</span>
      <h1 style="font-size:1.8rem;margin-top:.3rem">You're going, ${esc(o.buyer_name.split(' ')[0])}!</h1>
      <div class="muted">${esc(o.title)} · ${esc(fmtDate(o.starts_at))}<br>${esc(o.venue)}</div></div>
      <button class="btn secondary no-print" onclick="window.print()">Print or save PDF</button></div>
    <p class="muted small no-print">We also emailed these tickets. Show one QR code per person at the gate. Each code works once.</p>
    <div class="stack">${o.tickets.map((t, i) => `
      <div class="stub ${t.checkedIn ? 'used' : ''}"><div class="main"><span class="badge">${esc(o.ticket_name)}</span>
        <h2 style="margin-top:.5rem">${esc(o.title)}</h2><div class="muted small">${esc(fmtDate(o.starts_at))}<br>${esc(o.venue)}</div>
        <p class="small" style="margin:.8rem 0 0"><b>Ticket ${i + 1} of ${o.tickets.length}</b> · ${esc(o.buyer_name)}<br>${t.checkedIn ? '<span class="badge warn">Already used at the gate</span>' : 'Ready to scan'}</p></div>
        <div class="side"><img class="qr" src="${t.qr}" alt="QR code for ticket ${i + 1}"></div></div>`).join('')}</div>
    <div class="card flat" style="margin:1.4rem 0"><h3>Order summary</h3>
      <div class="sum" style="border:0;margin:0;padding:0"><div><span>${o.quantity} × ${esc(o.ticket_name)}</span><span>${naira(o.subtotal_kobo)}</span></div>
        ${o.fee_kobo && o.amount_kobo > o.subtotal_kobo ? `<div class="muted"><span>Service fee</span><span>${nairaZero(o.fee_kobo)}</span></div>` : ''}
        <div class="total"><span>Total paid</span><span>${naira(o.amount_kobo)}</span></div></div>
      <p class="muted small" style="margin:.8rem 0 0">Order reference: ${esc(o.reference)}</p></div>
    ${shareBlock}
    ${refundBlock}`;

  document.querySelector('#copy-link')?.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(shareUrl); } catch (e) { const f = document.querySelector('#share-link'); f.select(); document.execCommand('copy'); }
    toast('Link copied. Share it anywhere.');
  });
  document.querySelector('#native-share')?.addEventListener('click', () => navigator.share({ title: o.title, text: shareText, url: shareUrl }).catch(() => {}));

  document.querySelector('#refund')?.addEventListener('click', async () => {
    const email = document.querySelector('#remail').value.trim();
    const rmsg = document.querySelector('#rmsg');
    if (!email) { rmsg.innerHTML = '<p class="notice err">Enter the email you used at checkout.</p>'; return; }
    const { ok } = await confirmDialog({ title: 'Refund this order?', text: `${nairaZero(o.amount_kobo)} will be returned and your tickets will stop working. This cannot be undone.`, confirmLabel: 'Yes, refund me', danger: true });
    if (!ok) return;
    try { await api(`/api/orders/${encodeURIComponent(o.reference)}/refund`, { email }); toast('Refund started. Check your email.'); load(); }
    catch (err) { rmsg.innerHTML = `<p class="notice err">${esc(err.message)}</p>`; }
  });

  document.querySelector('#send-request')?.addEventListener('click', async (e) => {
    const email = document.querySelector('#qemail').value.trim(), reason = document.querySelector('#qreason').value.trim();
    const qmsg = document.querySelector('#qmsg');
    if (!email) { qmsg.innerHTML = '<p class="notice err">Enter the email you used at checkout.</p>'; return; }
    e.target.disabled = true;
    try { await api(`/api/orders/${encodeURIComponent(o.reference)}/refund-request`, { email, reason }); toast('Request sent. The organizer will reply by email.'); load(); }
    catch (err) { qmsg.innerHTML = `<p class="notice err">${esc(err.message)}</p>`; e.target.disabled = false; }
  });
}
ref ? load() : message('No order found', 'This link is missing an order reference.', '<p><a class="btn" href="/">Browse events</a></p>');
</script></body></html>
